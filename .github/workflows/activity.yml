name: Refresh activity panel

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/profile/**"
      - ".github/workflows/activity.yml"

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render contribution panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 tools/profile/activity.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/svg/activity-dark.svg assets/svg/activity-light.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh activity panel"
          git pull --rebase --autostash origin main
          git push
