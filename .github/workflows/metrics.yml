name: Generate Animated Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Falls back to the built-in token if METRICS_TOKEN is not set, so the
          # workflow still produces output instead of failing outright.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          # Commit with the built-in token: a PAT-authored commit would be able
          # to re-trigger workflows.
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: vinayak533
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact
