<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Vinayak K V - Data Scientist, ML Engineer, GenAI Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000428"/>
      <stop offset="45%" stop-color="#001a4d"/>
      <stop offset="100%" stop-color="#000208"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#7B5CFF"/>
      <animate attributeName="x1" values="-1;0;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect width="1200" height="420" rx="14"/></clipPath>
    <clipPath id="floorClip"><rect x="0" y="300" width="1200" height="120"/></clipPath>

    <clipPath id="termBody"><rect x="1" y="30" width="418" height="179"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>

    <!-- starfield -->
    <g fill="#9fe8ff">
      <circle cx="90" cy="60" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="38" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="92" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="46" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="80" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="5.1s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="34" r="1.1"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="70" r="1.7"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="150" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="180" r="1.3"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="150" r="1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="196" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="5.6s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="150" r="1"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="4.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- perspective neon floor -->
    <g clip-path="url(#floorClip)" opacity="0.55">
      <g stroke="#00F7FF" stroke-width="1" fill="none" opacity="0.5">
        <line x1="600" y1="300" x2="-500" y2="420"/>
        <line x1="600" y1="300" x2="-140" y2="420"/>
        <line x1="600" y1="300" x2="180" y2="420"/>
        <line x1="600" y1="300" x2="420" y2="420"/>
        <line x1="600" y1="300" x2="600" y2="420"/>
        <line x1="600" y1="300" x2="780" y2="420"/>
        <line x1="600" y1="300" x2="1020" y2="420"/>
        <line x1="600" y1="300" x2="1340" y2="420"/>
        <line x1="600" y1="300" x2="1700" y2="420"/>
      </g>
      <g stroke="#36BCF7" stroke-width="1.2" fill="none">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 40" dur="2.4s" repeatCount="indefinite"/>
          <line x1="0" y1="306" x2="1200" y2="306" opacity="0.25"/>
          <line x1="0" y1="318" x2="1200" y2="318" opacity="0.35"/>
          <line x1="0" y1="334" x2="1200" y2="334" opacity="0.45"/>
          <line x1="0" y1="356" x2="1200" y2="356" opacity="0.6"/>
          <line x1="0" y1="386" x2="1200" y2="386" opacity="0.8"/>
        </g>
      </g>
      <rect x="0" y="300" width="1200" height="120" fill="url(#fade)" opacity="0.25"/>
    </g>

    <!-- terminal window -->
    <g transform="translate(60,96)">
      <rect width="420" height="210" rx="10" fill="#050b1e" stroke="#00F7FF" stroke-opacity="0.35"/>
      <rect width="420" height="30" rx="10" fill="#0b1533"/>
      <rect y="20" width="420" height="10" fill="#0b1533"/>
      <circle cx="20" cy="15" r="5" fill="#ff5f56"/>
      <circle cx="38" cy="15" r="5" fill="#ffbd2e"/>
      <circle cx="56" cy="15" r="5" fill="#27c93f"/>
      <text x="210" y="19" font-family="Consolas,Monaco,monospace" font-size="11" fill="#5f7599" text-anchor="middle">vinayak@ai-lab: ~/agents</text>

      <g clip-path="url(#termBody)" font-family="Consolas,Monaco,monospace" font-size="13">
        <text x="16" y="60" fill="#00F7FF">$ python train_agent.py</text>
        <rect x="14" y="45" width="390" height="20" fill="#050b1e">
          <animate attributeName="x" values="14;14;191;191;14" keyTimes="0;0.05;0.15;0.95;1" dur="13s" repeatCount="indefinite"/>
        </rect>

        <text x="16" y="86" fill="#8fa3c8">&gt; loading llm backbone ...ok</text>
        <rect x="14" y="71" width="390" height="20" fill="#050b1e">
          <animate attributeName="x" values="14;14;226;226;14" keyTimes="0;0.17;0.27;0.95;1" dur="13s" repeatCount="indefinite"/>
        </rect>

        <text x="16" y="112" fill="#8fa3c8">&gt; building rag index ....ok</text>
        <rect x="14" y="97" width="390" height="20" fill="#050b1e">
          <animate attributeName="x" values="14;14;221;221;14" keyTimes="0;0.29;0.39;0.95;1" dur="13s" repeatCount="indefinite"/>
        </rect>

        <text x="16" y="138" fill="#8fa3c8">&gt; spawning 4 agents ....ok</text>
        <rect x="14" y="123" width="390" height="20" fill="#050b1e">
          <animate attributeName="x" values="14;14;212;212;14" keyTimes="0;0.41;0.51;0.95;1" dur="13s" repeatCount="indefinite"/>
        </rect>

        <text x="16" y="164" fill="#27c93f">✔ pipeline deployed 100%</text>
        <rect x="14" y="149" width="390" height="20" fill="#050b1e">
          <animate attributeName="x" values="14;14;201;201;14" keyTimes="0;0.53;0.63;0.95;1" dur="13s" repeatCount="indefinite"/>
        </rect>
      </g>
      <rect x="16" y="178" width="8" height="15" fill="#00F7FF">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- name + role -->
    <g transform="translate(530,150)">
      <text font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="6" fill="url(#neon)" filter="url(#glow)">VINAYAK K V</text>
      <rect x="2" y="18" width="0" height="2.5" fill="url(#neon)" filter="url(#softglow)">
        <animate attributeName="width" values="0;600;600;0" keyTimes="0;0.25;0.85;1" dur="13s" repeatCount="indefinite"/>
      </rect>
      <text y="52" font-family="Consolas,Monaco,monospace" font-size="17" letter-spacing="2.4" fill="#7fd9ff">
        DATA SCIENTIST // ML ENGINEER // GenAI BUILDER
        <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" repeatCount="indefinite"/>
      </text>

      <g transform="translate(0,84)" font-family="Consolas,Monaco,monospace" font-size="12" fill="#00F7FF">
        <g>
          <rect width="132" height="26" rx="13" fill="#00F7FF" fill-opacity="0.08" stroke="#00F7FF" stroke-opacity="0.45"/>
          <text x="66" y="17" text-anchor="middle">LLM  ·  RAG</text>
        </g>
        <g transform="translate(144,0)">
          <rect width="132" height="26" rx="13" fill="#7B5CFF" fill-opacity="0.10" stroke="#7B5CFF" stroke-opacity="0.5"/>
          <text x="66" y="17" text-anchor="middle" fill="#bda8ff">AI  AGENTS</text>
        </g>
        <g transform="translate(288,0)">
          <rect width="132" height="26" rx="13" fill="#36BCF7" fill-opacity="0.10" stroke="#36BCF7" stroke-opacity="0.5"/>
          <text x="66" y="17" text-anchor="middle" fill="#8fd9ff">MLOps</text>
        </g>
      </g>
    </g>

    <!-- rising data particles -->
    <g fill="#00F7FF">
      <circle cx="520" cy="420" r="2" opacity="0.7"><animate attributeName="cy" values="420;-20" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="420" r="1.6" opacity="0.7"><animate attributeName="cy" values="420;-20" dur="9s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="420" r="2.2" opacity="0.6"><animate attributeName="cy" values="420;-20" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.75;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="420" r="1.4" opacity="0.6"><animate attributeName="cy" values="420;-20" dur="10s" begin="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="10s" begin="4.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- scanline sweep -->
    <rect x="-260" y="0" width="260" height="420" fill="#00F7FF" opacity="0.045">
      <animate attributeName="x" values="-260;1200" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <rect width="1200" height="420" rx="14" fill="none" stroke="#00F7FF" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
</svg>
