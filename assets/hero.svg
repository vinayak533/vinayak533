<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-label="AI/ML ENGINEER - I build autonomous agents that turn raw data into decisions."><defs><radialGradient id="b0"><stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.85"/><stop offset="55%" stop-color="#7C5CFF" stop-opacity="0.35"/><stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient><radialGradient id="b1"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85"/><stop offset="55%" stop-color="#22D3EE" stop-opacity="0.35"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><radialGradient id="b2"><stop offset="0%" stop-color="#F472B6" stop-opacity="0.85"/><stop offset="55%" stop-color="#F472B6" stop-opacity="0.35"/><stop offset="100%" stop-color="#F472B6" stop-opacity="0"/></radialGradient><radialGradient id="b3"><stop offset="0%" stop-color="#4F46E5" stop-opacity="0.85"/><stop offset="55%" stop-color="#4F46E5" stop-opacity="0.35"/><stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/></radialGradient><radialGradient id="b4"><stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.85"/><stop offset="55%" stop-color="#7C5CFF" stop-opacity="0.35"/><stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient><linearGradient id="wm" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C5CFF"/><stop offset="30%" stop-color="#22D3EE"/><stop offset="62%" stop-color="#F472B6"/><stop offset="100%" stop-color="#7C5CFF"/><animate attributeName="x1" values="-1;0;1" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1;2" dur="9s" repeatCount="indefinite"/></linearGradient><linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/><stop offset="30%" stop-color="#22D3EE" stop-opacity="0.9"/><stop offset="70%" stop-color="#F472B6" stop-opacity="0.9"/><stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/></linearGradient><radialGradient id="vig" cx="0.5" cy="0.45" r="0.78"><stop offset="55%" stop-color="#000000" stop-opacity="0"/><stop offset="100%" stop-color="#070b18" stop-opacity="0.92"/></radialGradient><filter id="soften" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="46"/></filter><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffffff" opacity="0.05"/></pattern><clipPath id="card"><rect x="10" y="10" width="1020" height="300" rx="18"/></clipPath></defs><style>.s{font-family:'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif}@keyframes d0{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,34px) scale(1.12)}100%{transform:translate(0,0) scale(1)}}.d0{animation:d0 26s ease-in-out infinite}@keyframes d1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,40px) scale(1.12)}100%{transform:translate(0,0) scale(1)}}.d1{animation:d1 31s ease-in-out infinite}@keyframes d2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(46px,-36px) scale(1.12)}100%{transform:translate(0,0) scale(1)}}.d2{animation:d2 37s ease-in-out infinite}@keyframes d3{0%{transform:translate(0,0) scale(1)}50%{transform:translate(54px,-28px) scale(1.12)}100%{transform:translate(0,0) scale(1)}}.d3{animation:d3 23s ease-in-out infinite}@keyframes d4{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-30px) scale(1.12)}100%{transform:translate(0,0) scale(1)}}.d4{animation:d4 29s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.3,1) both}@keyframes widen{from{transform:scaleX(0)}to{transform:scaleX(1)}}.widen{transform-origin:520.0px 0;animation:widen 1.1s cubic-bezier(.2,.8,.25,1) both}</style><rect x="10" y="10" width="1020" height="300" rx="18" fill="#070b18"/><g clip-path="url(#card)"><g filter="url(#soften)"><ellipse class="d0" cx="250" cy="110" rx="300" ry="200" fill="url(#b0)"/><ellipse class="d1" cx="760" cy="90" rx="320" ry="190" fill="url(#b1)"/><ellipse class="d2" cx="560" cy="260" rx="340" ry="180" fill="url(#b2)"/><ellipse class="d3" cx="120" cy="250" rx="260" ry="170" fill="url(#b3)"/><ellipse class="d4" cx="900" cy="250" rx="240" ry="160" fill="url(#b4)"/></g><rect x="10" y="10" width="1020" height="300" fill="url(#dots)"/><rect x="10" y="10" width="1020" height="300" fill="url(#vig)"/></g><text class="s rise" x="520.0" y="164.0" text-anchor="middle" font-size="66" font-weight="800" letter-spacing="7" fill="url(#wm)" style="animation-delay:.1s">AI/ML ENGINEER</text><rect class="widen" x="310.0" y="190.0" width="420" height="2.5" rx="1.25" fill="url(#rule)" style="animation-delay:.5s"/><text class="s rise" x="520.0" y="230.0" text-anchor="middle" font-size="17" fill="#94A3B8" letter-spacing="0.4" style="animation-delay:.7s">I build autonomous agents that turn raw data into decisions.</text><rect x="10" y="10" width="1020" height="300" rx="18" fill="none" stroke="#E2E8F0" stroke-opacity="0.09"/></svg>