<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-labelledby="t d"><title id="t">Engineering system map</title><desc id="d">Agent graphs with real tools (loom.ai · LangGraph + E2B); Model router with fallback (loom.ai · 8 models, 3 providers); Retrieval with citations (loom.ai · notebooks); LLM-as-judge evaluation (llm-battle-arena); Streaming WebSocket backends (loom.ai · inforge-ai); Next.js + TypeScript products (lazyhire · loom.ai); Auth, CSP, CSRF, encryption (lazyhire); E2E tests and CI checks (lazyhire · loom.ai); Multi-agent analytics pipeline (inforge-ai · 8 stages); Model benchmarking (inforge-ai · sklearn + XGBoost); Natural language → SQL (nl2sql · 18/20 own benchmark); Dataset health profiling (insightgenie)</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}.mob{display:none}@media (max-width:560px){.dsk{display:none}.mob{display:inline}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}.fade{animation:fade .9s ease-out both}.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.draw{stroke-dasharray:100;animation:draw 1.2s cubic-bezier(.65,0,.25,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="879" height="449" rx="14" fill="#0B0E14" stroke="#232A34"/><rect x="350" y="24" width="180" height="40" rx="20" fill="#10141B" stroke="#323B47"/><g class="dsk"><text x="441" y="49" class="m" font-size="13" fill="#E6EDF3" text-anchor="middle" letter-spacing="3">VINAYAK K V</text></g><g class="mob"><text x="441" y="53