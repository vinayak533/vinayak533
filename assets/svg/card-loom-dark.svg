<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="title desc"><title id="title">loom.ai</title><desc id="desc">loom.ai, flagship agent workspace: a coding agent inside a real Linux sandbox that streams every tool call. Request path: Next.js trace UI, FastAPI WebSocket, LangGraph StateGraph, model router with fallback, tools, E2B sandbox; events stream back over the same WebSocket. Median time-to-first-token 8.9s to 5.0s with prompt caching; 8 models across Groq, OpenRouter and OpenCode; 10 specialist agents with human approval.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.f{font-family:Georgia,'Times New Roman',Times,serif}@keyframes flow{to{stroke-dashoffset:-10}}.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite}@keyframes req{0%{transform:translateX(0);opacity:0}4%{opacity:1}62%{transform:translateX(695.0px);opacity:1}68%,100%{transform:translateX(695.0px);opacity:0}}.req{animation:req 6s cubic-bezier(.45,0,.25,1) infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style><defs><linearGradient id="cb" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse"><stop stop-color="#10151D"/><stop offset=".55" stop-color="#0C1421"/><stop offset="1" stop-color="#182F56"/></linearGradient><radialGradient id="cg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(440.0 402.8) scale(545.6 220.4)"><stop stop-color="#3B82F6" stop-opacity="0.85"/><stop offset=".45" stop-color="#3B82F6" stop-opacity="0.27"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient><linearGradient id="cr" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity="0.11"/><stop offset=".5" stop-color="#93C5FD" stop-opacity="0.22"/><stop offset="1" stop-color="#93C5FD" stop-opacity="0.95"/></linearGradient><clipPath id="ck"><rect x="1" y="1" width="878" height="378" rx="19"/></clipPath><filter id="cf" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect x="0.75" y="0.75" width="878.5" height="378.5" rx="20" fill="url(#cb)"/><g clip-path="url(#ck)"><rect x="0" y="0" width="880" height="380" fill="url(#cg)"/><ellipse cx="440.0" cy="380.0" rx="352.0" ry="13" fill="#93C5FD" opacity="0.65" filter="url(#cf)"/></g><rect x="0.75" y="0.75" width="878.5" height="378.5" rx="20" fill="none" stroke="url(#cr)" stroke-width="1.5"/><path d="M26 1.5H854" stroke="#FFFFFF" stroke-opacity=".10"/><defs><linearGradient id="tg-blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#93C5FD" stop-opacity="1"/><stop offset="1" stop-color="#93C5FD" stop-opacity="0.45"/></linearGradient><linearGradient id="tg-green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#86EFAC" stop-opacity="1"/><stop offset="1" stop-color="#86EFAC" stop-opacity="0.45"/></linearGradient><linearGradient id="tg-orange" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FDBA74" stop-opacity="1"/><stop offset="1" stop-color="#FDBA74" stop-opacity="0.45"/></linearGradient><linearGradient id="tg-violet" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#C4B5FD" stop-opacity="1"/><stop offset="1" stop-color="#C4B5FD" stop-opacity="0.45"/></linearGradient><linearGradient id="tg-cyan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#67E8F9" stop-opacity="1"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0.45"/></linearGradient><linearGradient id="tg-yellow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FDE047" stop-opacity="1"/><stop offset="1" stop-color="#FDE047" stop-opacity="0.45"/></linearGradient><linearGradient id="tg-pink" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F9A8D4" stop-opacity="1"/><stop offset="1" stop-color="#F9A8D4" stop-opacity="0.45"/></linearGradient><linearGradient id="tg-gray" x1=