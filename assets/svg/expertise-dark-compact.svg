<svg xmlns="http://www.w3.org/2000/svg" width="400" height="684" viewBox="0 0 400 684" role="img" aria-labelledby="title desc"><title id="title">Engineering expertise</title><desc id="desc">Agent systems (loom.ai): Tool execution in a real Linux sandbox; model routing with provider fallback. Grounded generation (loom.ai · lazyhire): Answers that cite sources or abstain; CV drafts checked for invented claims. Applied ML (InForge-AI · InsightGenie): Cleaning, EDA and model benchmarking, with local fallbacks when LLMs fail. Principles: Deterministic core, Cite or abstain, Fail over, not out, Documented limits.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.f{font-family:Georgia,'Times New Roman',Times,serif}@media(prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style><defs><linearGradient id="e0b" x1="0" y1="0" x2="0" y2="186" gradientUnits="userSpaceOnUse"><stop stop-color="#10151D"/><stop offset=".55" stop-color="#0C1421"/><stop offset="1" stop-color="#162C4F"/></linearGradient><radialGradient id="e0g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200.0 197.2) scale(248.0 107.9)"><stop stop-color="#3B82F6" stop-opacity="0.77"/><stop offset=".45" stop-color="#3B82F6" stop-opacity="0.24"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient><linearGradient id="e0r" x1="0" y1="0" x2="0" y2="186" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity="0.11"/><stop offset=".5" stop-color="#93C5FD" stop-opacity="0.22"/><stop offset="1" stop-color="#93C5FD" stop-opacity="0.95"/></linearGradient><clipPath id="e0k"><rect x="1" y="1" width="398" height="184" rx="19"/></clipPath><filter id="e0f" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect x="0.75" y="0.75" widt