<svg xmlns="http://www.w3.org/2000/svg" width="400" height="738" viewBox="0 0 400 738" role="img" aria-labelledby="title desc"><title id="title">Tech stack</title><desc id="desc">AI / ML: pandas, NumPy, scikit-learn, XGBoost; LLMs and agents: LangGraph, CrewAI, LlamaIndex, Vanna 2.0, OpenAI SDK; Model APIs: Groq, Gemini, OpenRouter; Backend: Python, FastAPI, WebSockets, Pydantic; Frontend: TypeScript, Next.js, React, Tailwind CSS; Data: PostgreSQL, Supabase, pgvector, SQLite, Drizzle; Cloud and delivery: E2B, Docker, GitHub Actions, Playwright, Vercel, Render</desc><style>:root{--bg:#000000;--raise:#101015;--fill:#1A1A22;--line:#26262F;--text:#F4F5F6;--text2:#B4B8C2;--text3:#8D929D;--inv:#F4F5F6;--invtext:#0D0D0D;--dot:#26262F;--blue:#8AB4F8;--green:#7EE2A8;--amber:#FFC078;--violet:#B9A6FB;--violetlo:#5C4AA8;}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.f{font-family:Georgia,'Times New Roman',Times,serif}@media(prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style><rect x="0.5" y="0.5" width="399" height="737" rx="24" fill="var(--bg)" stroke="var(--line)"/><text x="24" y="52" class="s" font-size="14.5" fill="var(--text3)">AI / ML</text><text x="24" y="82" class="s" font-size="18" fill="var(--text)" font-weight="500">pandas</text><text x="106.37" y="82" class="s" font-size="18" fill="var(--text)" font-weight="500">NumPy</text><text x="190.252" y="82" class="s" font-size="18" fill="var(--text)" font-weight="500">scikit-learn</text><text x="24" y="112" class="s" font-size="18" fill="var(--text)" font-weight="500">XGBoost</text><path d="M24 126H376" stroke="var(--line)"/><text x="24" y="156" class="s" font-size="14.5" fill="var(--text3)">LLMs and agents</text><text x="24" y="186" class="s" font-size="18" fill="var(--text)" font-weight="500">LangGraph</text><text