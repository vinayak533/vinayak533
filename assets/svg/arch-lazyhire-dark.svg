<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="t d"><title id="t">lazyhire architecture</title><desc id="d">Discovery: career brief, 9 job sources, apply-link validation, merge and dedupe, rank and explain. AI path: question or CV task, privacy and CSRF checks, authored knowledge retrieval first, optional LLM (DeepSeek then Groq), guarded output that rejects invented numbers.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}.mob{display:none}@media (max-width:560px){.dsk{display:none}.mob{display:inline}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}.fade{animation:fade .9s ease-out both}.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.draw{stroke-dasharray:100;animation:draw 1.2s cubic-bezier(.65,0,.25,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="879" height="309" rx="14" fill="#0B0E14" stroke="#232A34"/><text x="32" y="38" class="m" font-size="11" fill="#8AB4F8" letter-spacing="2">DISCOVERY</text><g class="rise" style="animation-delay:0.20s"><rect x="32" y="52" width="140" height="64" rx="9" fill="#10141B" stroke="#232A34"/><g class="dsk"><text x="102" y="80" class="s" font-size="13.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Career brief</text><text x="102" y="99" class="m" font-size="10" fill="#6B7580" text-anchor="middle">role · place · skills</text></g><g class="mob"><text x="102" y="93" class="s" font-size="23" fill="#E6EDF3" text-anchor="middle" font-weight="600">Brief</text></g></g><path d="M174 84L199 84" pathLength="100" class="draw" stroke="#8AB4F8" stroke-width="1" stroke-opacity="0.7" fill="none" style="animation-delay:0.50s"/><g class="rise" style="animation-delay:0.30s"><rect x="201" y="52" width="140" height="64" rx="9" fill="#10141B" stroke="#232A34"/><g class="dsk"><text x="271" y="80" class="s" font-size="13.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">9 job sources</text><text x="271" y="99" class="m" font-size="10" fill="#6B7580" text-anchor="middle">Technopark · Infopark …</text></g><g class="mob"><text x="271" y="93" class="s" font-size="23" fill="#E6EDF3" text-anchor="middle" font-weight="600">Sources</text></g></g><path d="M343 84L368 84" pathLength="100" class="draw" stroke="#8AB4F8" stroke-width="1" stroke-opacity="0.7" fill="none" style="animation-delay:0.60s"/><g class="rise" style="animation-delay:0.40s"><rect x="370" y="52" width="140" height="64" rx="9" fill="#10141B" stroke="#232A34"/><g class="dsk"><text x="440" y="80" class="s" font-size="13.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Validate links</text><text x="440" y="99" class="m" font-size="10" fill="#6B7580" text-anchor="middle">posting / ATS URLs only</text></g><g class="mob"><text x="440" y="93" class="s" font-size="23" fill="#E6EDF3" text-anchor="middle" font-weight="600">Validate</text></g></g><path d="M512 84L537 84" pathLength="100" class="draw" stroke="#8AB4F8" stroke-width="1" stroke-opacity="0.7" fill="none" style="animation-delay:0.70s"/><g class="rise" style="animation-delay:0.50s"><rect x="539" y="52" width="140" height="64" rx="9" fill="#10141B" stroke="#232A34"/><g class="dsk"><text x="609" y="80" class="s" font-size="13.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Merge + dedupe</text><text x="609" y="99" class="m" font-size="10" fill="#6B7580" text-anchor="middle">canonical URL + title</text></g><g class="mob"><text x="609" y="93" class="s" font-size="23" fill="#E6EDF3" text-anchor="middle" font-weight="600">Dedupe</text></g></g><path d="M681 84L706 84" pathLength="100" class="draw" stroke="#8AB4F8" stroke-width="1" stroke-opacity="0.7" fill="none" style="animation-delay:0.80s"/><g class="rise" style="animation-delay:0.60s"><rect x="708" y="52" width="140" height="64" rx="9" fill="#10141B" stroke="#232A34"/><g class="dsk"><text x="778" y="80" class="s" font-size="13.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Rank + explain</text><text x="778" y="99" class="m" font-size="10" fill="#6B7580" text-anchor="middle">fresh · fit · source</text></g><g class="mob"><text x="778" y="93" class="s" font-size="23" fill="#E6EDF3" text-anchor="middle" font-weight="600">Rank</text></g></g><text x="32" y="164" class="m" font-size="11" fill="#F2B45A" letter-spacing="2">AI PATH</text><g class="rise" style="animation-delay:0.60s"><rect x="32" y="178" width="140" height="64" rx="9" fill="#10141B" stroke="#232A34"/><g class="dsk"><text x="102" y="206" class="s" font-size="13.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Question / CV</text><text x="102" y="225" class="m" font-size="10" fill="#6B7580" text-anchor="middle">tutor · review · tailor</text></g><g class="mob"><text x="102" y="219" class="s" font-size="23" fill="#E6EDF3" text-anchor="middle" font-weight="600">Ask</text></g></g><path d="M174 210L199 210" pathLength="100" class="draw" stroke="#F2B45A" stroke-width="1" stroke-opacity="0.7" fill="none" style="animation-delay:0.90s"/><g class="rise" style="animation-delay:0.70s"><rect x="201" y="178" width="140" height="64" rx="9" fill="#10141B" stroke="#232A34"/><g class="dsk"><text x="271" y="206" class="s" font-size="13.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Privacy checks</text><text x="271" y="225" class="m" font-size="10" fill="#6B7580" text-anchor="middle">session · CSRF · consent</text></g><g class="mob"><text x="271" y="219" class="s" font-size="23" fill="#E6EDF3" text-anchor="middle" font-weight="600">Checks</text></g></g><path d="M343 210L368 210" pathLength="100" class="draw" stroke="#F2B45A" stroke-width="1" stroke-opacity="0.7" fill="none" style="animation-delay:1.00s"/><g class="rise" style="animation-delay:0.80s"><rect x="370" y="178" width="140" height="64" rx="9" fill="#10141B" stroke="#232A34"/><g class="dsk"><text x="440" y="206" class="s" font-size="13.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Authored KB</text><text x="440" y="225" class="m" font-size="10" fill="#6B7580" text-anchor="middle">retrieval first</text></g><g class="mob"><text x="440" y="219" class="s" font-size="23" fill="#E6EDF3" text-anchor="middle" font-weight="600">Knowledge</text></g></g><path d="M512 210L537 210" pathLength="100" class="draw" stroke="#F2B45A" stroke-width="1" stroke-opacity="0.7" fill="none" style="animation-delay:1.10s"/><g class="rise" style="animation-delay:0.90s"><rect x="539" y="178" width="140" height="64" rx="9" fill="#10141B" stroke="#232A34"/><g class="dsk"><text x="609" y="206" class="s" font-size="13.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Optional LLM</text><text x="609" y="225" class="m" font-size="10" fill="#6B7580" text-anchor="middle">DeepSeek → Groq</text></g><g class="mob"><text x="609" y="219" class="s" font-size="23" fill="#E6EDF3" text-anchor="middle" font-weight="600">LLM</text></g></g><path d="M681 210L706 210" pathLength="100" class="draw" stroke="#F2B45A" stroke-width="1" stroke-opacity="0.7" fill="none" style="animation-delay:1.20s"/><g class="rise" style="animation-delay:1.00s"><rect x="708" y="178" width="140" height="64" rx="9" fill="#10141B" stroke="#232A34"/><g class="dsk"><text x="778" y="206" class="s" font-size="13.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Guarded output</text><text x="778" y="225" class="m" font-size="10" fill="#6B7580" text-anchor="middle">no invented numbers</text></g><g class="mob"><text x="778" y="219" class="s" font-size="23" fill="#E6EDF3" text-anchor="middle" font-weight="600">Guard</text></g></g><g class="dsk"><text x="32" y="284" class="m" font-size="11" fill="#6B7580">lib/cv/tailor-guardrails.ts rejects fabricated numbers, unsupported requirements and untraceable changes.</text></g></svg>
