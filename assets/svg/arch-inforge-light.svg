<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="t d"><title id="t">InForge-AI architecture</title><desc id="d">Eight stages run in order: ingest, clean, EDA, visualize, ML, insights, code, chat. A deterministic core (pandas, NumPy, scikit-learn, XGBoost, Matplotlib, ReportLab) computes results; optional LLM enrichment (OpenRouter, Groq, Gemini) writes prose, with local heuristics when a call fails.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}.mob{display:none}@media (max-width:560px){.dsk{display:none}.mob{display:inline}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}.fade{animation:fade .9s ease-out both}.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.draw{stroke-dasharray:100;animation:draw 1.2s cubic-bezier(.65,0,.25,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="879" height="269" rx="14" fill="#FBFCFD" stroke="#D8DEE5"/><rect x="32" y="28" width="816" height="40" rx="9" fill="none" stroke="#B25E00" stroke-opacity=".7" stroke-dasharray="4 5"/><g class="dsk"><text x="48" y="53" class="m" font-size="11" fill="#B25E00" letter-spacing="2">LLM ENRICHMENT</text><text x="186" y="53" class="s" font-size="12" fill="#57606A">OpenRouter · Groq · Gemini — optional; local heuristics when a call fails</text></g><g class="mob"><text x="440" y="58" class="s" font-size="23" fill="#B25E00" text-anchor="middle">LLM enrichment · optional</text></g><rect x="32" y="200" width="816" height="40" rx="9" fill="#F2F5F8" stroke="#C3CBD5"/><g class="dsk"><text x="48" y="225" class="m" font-size="11" fill="#1A73E8" letter-spacing="2">DETERMINISTIC CORE</text><text x="212" y="225" class="s" font-size="12" fill="#57606A">pandas · NumPy · scikit-learn · XGBoost · Matplotlib · ReportLab</text></g><g class="mob"><text x="440" y="230" class="s" font-size="23" fill="#1A73E8" text-anchor="middle">Deterministic core</text></g><path d="M76 68V110" stroke="#B25E00" stroke-opacity=".6" stroke-dasharray="3 4"/><path d="M76 158L76 200" pathLength="100" class="draw" stroke="#1A73E8" stroke-width="1" stroke-opacity="0.45" fill="none" style="animation-delay:0.50s"/><g class="rise" style="animation-delay:0.20s"><rect x="32" y="110" width="88" height="48" rx="8" fill="#F2F5F8" stroke="#D8DEE5"/><g class="dsk"><text x="76" y="129" class="m" font-size="9.5" fill="#848D97" text-anchor="middle">01</text><text x="76" y="148" class="s" font-size="13" fill="#1F2328" text-anchor="middle" font-weight="600">Ingest</text></g><g class="mob"><text x="76" y="142" class="s" font-size="19" fill="#1F2328" text-anchor="middle" font-weight="600">Ingest</text></g></g><path d="M121 134L135 134" pathLength="100" class="draw" stroke="#1A73E8" stroke-width="1" stroke-opacity="0.7" fill="none" style="animation-delay:0.60s"/><path d="M180 158L180 200" pathLength="100" class="draw" stroke="#1A73E8" stroke-width="1" stroke-opacity="0.45" fill="none" style="animation-delay:0.56s"/><g class="rise" style="animation-delay:0.29s"><rect x="136" y="110" width="88" height="48" rx="8" fill="#F2F5F8" stroke="#D8DEE5"/><g class="dsk"><text x="180" y="129" class="m" font-size="9.5" fill="#848D97" text-anchor="middle">02</text><text x="180" y="148" class="s" font-size="13" fill="#1F2328" text-anchor="middle" font-weight="600">Clean</text></g><g class="mob"><text x="180" y="142" class="s" font-size="19" fill="#1F2328" text-anchor="middle" font-weight="600">Clean</text></g></g><path d="M225 134L239 134" pathLength="100" class="draw" s