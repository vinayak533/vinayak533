<svg xmlns="http://www.w3.org/2000/svg" width="400" height="398" viewBox="0 0 400 398" role="img" aria-labelledby="title desc"><title id="title">InForge-AI</title><desc id="desc">InForge-AI: Eight pipeline agents turn a CSV or Excel file into analysis, models and a report. Pipeline: ingest → clean → EDA → visualize → ML benchmark → insights → code → chat. Stack: FastAPI · WebSockets · pandas · scikit-learn · XGBoost · React. Completes without an llm provider.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.f{font-family:Georgia,'Times New Roman',Times,serif}@media(prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style><defs><linearGradient id="cb" x1="0" y1="0" x2="0" y2="398" gradientUnits="userSpaceOnUse"><stop stop-color="#10151D"/><stop offset=".55" stop-color="#1A1311"/><stop offset="1" stop-color="#462612"/></linearGradient><radialGradient id="cg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200.0 421.9) scale(248.0 230.8)"><stop stop-color="#F97316" stop-opacity="0.72"/><stop offset=".45" stop-color="#F97316" stop-opacity="0.23"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient><linearGradient id="cr" x1="0" y1="0" x2="0" y2="398" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity="0.11"/><stop offset=".5" stop-color="#FDBA74" stop-opacity="0.22"/><stop offset="1" stop-color="#FDBA74" stop-opacity="0.95"/></linearGradient><clipPath id="ck"><rect x="1" y="1" width="398" height="396" rx="19"/></clipPath><filter id="cf" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect x="0.75" y="0.75" width="398.5" height="396.5" rx="20" fill="url(#cb)"/><g clip-path="url(#ck)"><rect x="0" y="0" width="400" height="398" fill="url(#cg)"/><ellipse cx="200.0" cy