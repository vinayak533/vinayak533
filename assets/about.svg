<svg xmlns="http://www.w3.org/2000/svg" width="940" height="613" viewBox="0 0 940 613" role="img" aria-label="Every model I have ever built started the same way: a messy dataset and a question nobody had time to answer. So I learned to answer them end to end — not just the notebook and the accuracy score, but the pipeline feeding it, the API standing in front of it, and the container it ships inside. Then the models started talking back. Models that reason, retrieve, and choose their own tools. I have been building there ever since: an autonomous analyst that turns raw tables into business intelligence, a translator that turns plain English into SQL, a multi-agent desk that reads the market while I sleep. The thread has never changed — take something raw and unreadable, and hand back something a person can actually act on."><defs><linearGradient id="em" gradientUnits="userSpaceOnUse" x1="62" y1="0" x2="910" y2="0"><stop offset="0%" stop-color="#7C5CFF"/><stop offset="45%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#F472B6"/></linearGradient><linearGradient id="spine" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/><stop offset="20%" stop-color="#7C5CFF" stop-opacity="0.9"/><stop offset="60%" stop-color="#22D3EE" stop-opacity="0.8"/><stop offset="100%" stop-color="#F472B6" stop-opacity="0"/></linearGradient></defs><style>.ser{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;font-style:italic}.s{font-family:'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif}@keyframes fin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}.fin{opacity:0;animation:fin .75s cubic-bezier(.2,.7,.3,1) both}@keyframes tall{from{transform:scaleY(0)}to{transform:scaleY(1)}}.tall{transform-origin:0 66px;animation:tall 1.2s cubic-bezier(.2,.8,.25,1) both}</style><rect width="940" height="613" rx="16" fill="#0a1020"/><rect width="940" height="613" rx="16" fill="none" stroke="#1e293b"/><circle cx="44" cy="24.0" r="4" fill="#22D3EE" opacity="0.9"/><text class="s" x="58" y="28.0" font-size="11.5" fill="#475569" letter-spacing="2.4">01 — THE STORY SO FAR</text><line x1="30" y1="44" x2="910" y2="44" stroke="#1e293b"/><rect class="tall" x="36" y="66" width="2.5" height="465" rx="1.25" fill="url(#spine)"/><text class="ser fin" x="62" y="103" font-size="50" fill="url(#em)" style="animation-delay:.1s">E</text><text class="ser fin" x="96" y="90" font-size="19" fill="#cbd5e1" style="animation-delay:0.15s" xml:space="preserve"><tspan>very model I have ever built started the same way: a</tspan><tspan> </tspan><tspan fill="url(#em)" font-style="normal" font-weight="600">messy dataset</tspan><tspan fill="url(#em)" font-style="normal" font-weight="600"> </tspan><tspan>and a</tspan></text><text class="ser fin" x="62" y="121" font-size="19" fill="#cbd5e1" style="animation-delay:0.28s" xml:space="preserve"><tspan>question nobody had time to answer.</tspan></text><text class="ser fin" x="62" y="183" font-size="19" fill="#cbd5e1" style="animation-delay:0.54s" xml:space="preserve"><tspan>So I learned to answer them</tspan><tspan> </tspan><tspan fill="url(#em)" font-style="normal" font-weight="600">end to end</tspan><tspan fill="url(#em)" font-style="normal" font-weight="600"> </tspan><tspan>— not just the notebook and the</tspan></text><text class="ser fin" x="62" y="214" font-size="19" fill="#cbd5e1" style="animation-delay:0.67s" xml:space="preserve"><tspan>accuracy score, but the pipeline feeding it, the API standing in front of it,</tspan></text><text class="ser fin" x="62" y="245" font-size="19" fill="#cbd5e1" style="animation-delay:0.80s" xml:space="preserve"><tspan>and the container it ships inside.</tspan></text><text class="ser fin" x="62" y="307" font-size="19" fill="#cbd5e1" style="animation-delay:1.06s" xml:space="preserve"><tspan>Then the models started talking back.</tspan><tspan> </tspan><tspan fill="url(#em)" font-style="normal" font-weight="600">Models that reason, retrieve, and choose</tspan></text><text class="ser fin" x="62" y="338" font-size="19" fill="#cbd5e1" style="animation-delay:1.19s" xml:space="preserve"><tspan fill="url(#em)" font-style="normal" font-weight="600">their own tools.</tspan><tspan fill="url(#em)" font-style="normal" font-weight="600"> </tspan><tspan>I have been building there ever since: an autonomous analyst</tspan></text><text class="ser fin" x="62" y="369" font-size="19" fill="#cbd5e1" style="animation-delay:1.32s" xml:space="preserve"><tspan>that turns raw tables into business intelligence, a translator that turns</tspan></text><text class="ser fin" x="62" y="400" font-size="19" fill="#cbd5e1" style="animation-delay:1.45s" xml:space="preserve"><tspan>plain English into SQL, a</tspan><tspan> </tspan><tspan fill="url(#em)" font-style="normal" font-weight="600">multi-agent desk</tspan><tspan fill="url(#em)" font-style="normal" font-weight="600"> </tspan><tspan>that reads the market while I</tspan></text><text class="ser fin" x="62" y="431" font-size="19" fill="#cbd5e1" style="animation-delay:1.58s" xml:space="preserve"><tspan>sleep.</tspan></text><text class="ser fin" x="62" y="493" font-size="19" fill="#cbd5e1" style="animation-delay:1.84s" xml:space="preserve"><tspan>The thread has never changed — take something raw and unreadable, and hand</tspan></text><text class="ser fin" x="62" y="524" font-size="19" fill="#cbd5e1" style="animation-delay:1.97s" xml:space="preserve"><tspan>back something a person can</tspan><tspan> </tspan><tspan fill="url(#em)" font-style="normal" font-weight="600">actually act on</tspan><tspan>.</tspan></text><line class="fin" x1="62" y1="557" x2="172" y2="557" stroke="#1e293b" style="animation-delay:2.10s"/><text class="s fin" x="62" y="579" font-size="12.5" fill="#94a3b8" style="animation-delay:2.10s">— still shipping, still curious</text></svg>